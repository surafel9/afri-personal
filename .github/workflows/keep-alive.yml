name: Keep Render Service Awake

on:
  schedule:
    # Ping every 10 minutes (Render spins down after 15 minutes of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service Health
        run: |
          curl -s -f -I "https://afri-personal.onrender.com/" || true
